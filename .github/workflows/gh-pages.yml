name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/gh-pages/**'
      - '.github/workflows/gh-pages.yml'
      - 'scripts/update_download_badges.py'
      - 'scripts/stamp_gh_pages.py'
      - 'scripts/check_gh_pages.py'
      - 'scripts/lang_switch_test.js'
  # The download badge is computed, not fetched: no badge service can take a
  # maximum over the releases array. Recomputing it on a schedule is what keeps
  # it from going stale, and it deploys without a commit — so no pull request,
  # no review, and nothing for anyone to remember at release time.
  # Weekly is close enough: the figure is one past release's count and it grows
  # slowly, so the badge trails reality by a week at worst.
  schedule:
    - cron: '17 5 * * 1'
  # A release is the one moment the push trigger cannot cover: tagging a version
  # touches none of the paths above, so nothing would redeploy and the badge
  # would sit on whatever the last site change published.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Deliberately non-blocking. If GitHub rate-limits us the script writes
      # nothing and the committed payload is published instead — an older true
      # number. Failing the deploy over a badge would take the whole site down
      # to protect a figure nobody navigates by.
      - name: Refresh the download badge
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_download_badges.py

      # The pages carry {{SITE_VERSION}} and {{SITE_UPDATED}} rather than a
      # version and a date typed by hand, which would be stale by the next
      # release. Not optional, unlike the badge above: a page that went out with
      # the placeholder still in it would be worse than one with no date at all.
      - name: Stamp the version and publication date into the pages
        run: python3 scripts/stamp_gh_pages.py

      # The switch is the one piece of this site that can strand a reader: a
      # wrong prefix is a 404, and a rule applied in both directions bounces the
      # browser between two languages. Neither shows up in the markup, so
      # neither is visible to the consistency check below.
      - name: Check the language switch behaves
        run: node scripts/lang_switch_test.js

      # Last gate before the site is public. Dead hreflang targets, a canonical
      # pointing at the wrong variant, a sitemap listing a redirect: all of them
      # render perfectly and cost the page its place in the index, so none of
      # them can be caught by looking at the result. Blocking on purpose.
      - name: Check the published pages are consistent
        run: python3 scripts/check_gh_pages.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
